## Neroland Core — shared foundation library (required dependency, loads BEFORE NeroSecurity).
## Consumed per-loader as za.co.neroland.nerolandcore:nerolandcore-<loader>-<mc>:<this>. Resolved from
## mavenLocal() or the NerolandCoreGitHubPackages maven declared in stonecutter.gradle. The manifest
## floor is this pinned version (floor = compiled Core version) so the loader refuses a Core too old
## to have the APIs NeroSecurity compiles against (config schema, offline-capable progression gates).
nerolandcore_version=1.17.0

## NeroEconomy — OPTIONAL. Compiled `compileOnly` against its API jar (never bundled, never required);
## one bridge class touches it, and only after isModLoaded("neroeconomy"). Resolved from mavenLocal() or the
## NeroEconomy GitHub Packages maven (declared in stonecutter.gradle only when credentials are present).
## Dev clients load it only with -PwithNeroEconomy, so the default run proves NeroSecurity works without it.
neroeconomy_version=0.5.0-beta.1

## Optional siblings - compileOnly behind compat facades (compat/<x>/<X>Compat); -PwithNeroFactions,
## -PwithNeroColonies, -PwithNerospace load one into a dev run. <x>_compat=false excludes the bridge class, its
## META-INF/services line and the manifest entry, for a build where the artifact does not resolve. Each is
## resolved as za.co.neroland.<id>:<id>-<loader>-<mc>:<version> from mavenLocal() or that mod's GitHub Packages maven
## (declared in stonecutter.gradle only when credentials are present). Manifest floors = these compiled versions.
nerofactions_version=0.7.0-beta.1
nerocolonies_version=0.6.1-beta.1
nerospace_version=2.0.1
nerofactions_compat=true
# NeroFactions 0.7.0-beta.1 is required (its public za.co.neroland.nerofactions.api is what the bridge uses).
# NeroFactions 0.7.0-beta.1, NeroColonies 0.6.1-beta.1 and Nerospace 2.0.0 resolve from mavenLocal() (owner-run publishToMavenLocal) or from
# their GitHub Packages mavens when gpr.user/gpr.key are set. Set a flag to false for a build where that artifact
# does not resolve. A per-Minecraft-version flag (<x>_compat_<mc>) overrides the global one for that cell only.
nerocolonies_compat=true
nerospace_compat=true

## Open Parties and Claims - OPTIONAL, claims only ever deny (xaero.pac, https://chocolateminecraft.com/maven;
## LGPL-3.0; compileOnly against the common API jar). -PwithOpac loads it into a NeoForge dev run.
opac_version_1.21.1=0.32.7
opac_version_1.21.4=0.31.6
opac_version_1.21.5=0.31.6
opac_version_1.21.8=0.32.7
opac_version_1.21.10=0.32.7
opac_version_1.21.11=0.32.7
opac_version_26.1.2=0.32.7
opac_version_26.2=0.32.7
opac_version_26.3=0.32.8
opac_compat=true
