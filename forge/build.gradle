// forge: full MinecraftForge userdev via ForgeGradle 7. Shares the common module's
// source directly (single copy -> no drift).

plugins {
    id 'net.minecraftforge.gradle'
    id 'net.minecraftforge.jarjar'
    id 'eclipse'
    id 'maven-publish'
}

// MC version comes from the Stonecutter node (e.g. :forge:26.1.2), not a global property.
def mc = stonecutter.current.version
def forgeVersion = project.findProperty("forge_version_${mc}")
def jeiVersion = project.findProperty("jei_version_${mc}")
def emiFile = project.findProperty("emi_file_neoforge_${mc}")
def nerolandcoreVersion = project.findProperty('nerolandcore_version')

if (!forgeVersion) {
    throw new GradleException("Missing forge_version_${mc} in gradle.properties")
}

// This node's projectDir is <loader>/versions/<v>; the authoritative loader source +
// templates live in the BRANCH root (forge/). Resolve branch-root paths via the parent.
def branchDir = project.parent.projectDir

// --- Optional siblings (compat facades) ---------------------------------------------------------------------
// NeroFactions, NeroColonies, Nerospace and Open Parties and Claims are compileOnly behind compat/<x>/<X>Compat:
// one bridge class per sibling imports it, found through a META-INF/services seam after isModLoaded. A
// `<x>_compat=false` property (gradle.properties or -P) drops the dependency, excludes that bridge class and its
// services line from the build, and leaves the optional manifest entry out, so the mod builds with no sibling
// artifact at all. Manifest floors are the compiled versions (ecosystem floor rule).
def compatOn = { String flag -> (rootProject.findProperty(flag) ?: 'true').toString().trim() == 'true' }
def siblingIds = ['nerofactions', 'nerocolonies', 'nerospace']
def siblingPkg = [nerofactions: 'factions', nerocolonies: 'colonies', nerospace: 'nerospace']
def siblingCls = [nerofactions: 'Factions', nerocolonies: 'Colonies', nerospace: 'Nerospace']
def siblingRun = [nerofactions: 'withNeroFactions', nerocolonies: 'withNeroColonies', nerospace: 'withNerospace']
def siblingOn = siblingIds.collectEntries { id -> [(id): compatOn("${id}_compat")] }
def opacVersion = rootProject.findProperty("opac_version_${mc}")
def opacOn = compatOn('opac_compat') && opacVersion != null
siblingIds.each { id ->
    if (!siblingOn[id]) {
        sourceSets.main.java.exclude "za/co/neroland/nerosecurity/compat/${siblingPkg[id]}/Nero${siblingCls[id]}Bridge.java"
        sourceSets.main.resources.exclude "META-INF/services/za.co.neroland.nerosecurity.compat.${siblingPkg[id]}.${siblingCls[id]}Bridge"
    }
}
if (!opacOn) {
    sourceSets.main.java.exclude 'za/co/neroland/nerosecurity/compat/claims/OpacClaimProvider.java'
    sourceSets.main.resources.exclude 'META-INF/services/za.co.neroland.nerosecurity.compat.claims.ClaimProvider'
}
def forgeBuild = forgeVersion.toString().split('-', 2)[1]
def forgeMajor = forgeBuild.split('\\.')[0]

// Distinct, descriptive jar name per cell.
base { archivesName = "nerosecurity-forge-${mc}" }

// Publish this cell's jar as a Maven artifact so other Nero mods can declare NeroSecurity a dependency:
// `za.co.neroland.nerosecurity:nerosecurity-forge-<mc>:<version>`. Mirrors Neroland Core's publishing setup.
// `./gradlew publishToMavenLocal` installs all nine cells locally for dev. Dependency-free POM on purpose.
publishing {
    publications {
        register('mod', MavenPublication) {
            groupId = rootProject.mod_group_id
            artifactId = "nerosecurity-forge-${mc}"
            version = rootProject.mod_version
            artifact tasks.named('jar')
        }
    }
    // Remote target so a fresh CI runner / clone (empty ~/.m2) can resolve NeroSecurity — GitHub Packages
    // Maven for the NeroSecurity repo. `publishToMavenLocal` still works for local dev; `publish` (or
    // publishModPublicationToGitHubPackagesRepository) pushes here. Auth: gradle props gpr.user/gpr.key,
    // else env GITHUB_ACTOR/GITHUB_TOKEN (both present in GitHub Actions). Lazy getOrNull() means a
    // build that doesn't touch this repo (e.g. a contributor with no token) won't fail at configuration.
    // Privacy (POPIA/GDPR): publishes only build artifacts + version strings, no personal data.
    repositories {
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/Neroland/nerosecurity'
            credentials {
                username = providers.gradleProperty('gpr.user').orElse(providers.environmentVariable('GITHUB_ACTOR')).getOrNull()
                password = providers.gradleProperty('gpr.key').orElse(providers.environmentVariable('GITHUB_TOKEN')).getOrNull()
            }
        }
    }
}

// Enable Forge's Jar-in-Jar task for embedded Sentry, mirroring Fabric include and NeoForge JarJar.
jarJar.register()

// Pull in the shared common source + resources.
sourceSets.main.java.srcDir rootProject.ext.commonJava
sourceSets.main.resources.srcDir rootProject.ext.commonResources

// Forge 26's ModLauncher builds a JPMS layer from the dev runtime classpath. If classes and
// processed resources are separate entries, the mod's classes can be seen as module "main" while
// mods.toml names the resources entry "nerosecurity", producing split-package startup failures.
sourceSets.main.output.resourcesDir = sourceSets.main.java.classesDirectory.get().asFile

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('runs/client')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', rootProject.mod_id

            if (project.hasProperty('nerosecurityDebug')) {
                jvmArgs '-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=*:5005'
            }
        }

        register('client')

        register('server') {
            workingDir = layout.projectDirectory.dir('runs/server')
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com/' }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${forgeVersion}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'

    // Neroland Core — REQUIRED shared foundation (config schema). Core ships as its own mod and
    // loads BEFORE NeroSecurity (see mods.toml, ordering = AFTER); it is never bundled.
    implementation "za.co.neroland.nerolandcore:nerolandcore-forge-${mc}:${nerolandcoreVersion}"

    // NeroEconomy — OPTIONAL. compileOnly: never bundled, never a hard requirement. Only the economy bridge
    // class imports it, and only after isModLoaded("neroeconomy"), so NeroSecurity runs without it.
    compileOnly "za.co.neroland.neroeconomy:neroeconomy-forge-${mc}:${rootProject.neroeconomy_version}"

    // Optional siblings — compileOnly, never bundled, never required (see the compat block above).
    siblingIds.each { id ->
        if (siblingOn[id]) {
            def coord = "za.co.neroland.${id}:${id}-forge-${mc}:${rootProject.property("${id}_version")}"
            compileOnly coord
        }
    }
    // Open Parties and Claims — compileOnly against the loader-neutral API jar (claims only ever deny).
    if (opacOn) {
        compileOnly("xaero.pac:open-parties-and-claims-common-${mc}:${opacVersion}") { transitive = false }
    }

    implementation 'io.sentry:sentry:8.60.0'
    jarJar(group: 'io.sentry', name: 'sentry', version: '8.45.0')

    // JEI common API only; Forge 26.x loader artifacts are not yet published on the pinned JEI lines.
    if (jeiVersion) {
        compileOnly "mezz.jei:jei-${mc}-common-api:${jeiVersion}"
    }

    // EMI: compile-only, so any shared compat/emi plugin compiles in the Forge cells. The port publishes no
    // Forge build, so this borrows the NeoForge jar for its loader-agnostic dev.emi.emi.api classes; nothing
    // EMI-related is loaded on Forge.
    if (emiFile) {
        compileOnly "curse.maven:emi-unofficial-port-unstable-1544558:${emiFile}"
    }
}

// The optional sibling entries of the generated manifest: a dependency block per enabled sibling, "" otherwise.
def tomlDep = { String modId, String floor, String reqKey, String reqVal ->
    "\n[[dependencies.${rootProject.mod_id}]]\nmodId = \"${modId}\"\n${reqKey} = ${reqVal}\nversionRange = \"[${floor},)\"\nordering = \"AFTER\"\nside = \"BOTH\"\n"
}
// Expand mods.toml from src/main/templates into generated resources.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def props = [
        mod_id                    : rootProject.mod_id,
        mod_version               : rootProject.mod_version,
        mod_name                  : rootProject.mod_name,
        mod_authors               : rootProject.mod_authors,
        mod_license               : rootProject.mod_license,
        forge_loader_version_range: "[${forgeMajor},)",
        minecraft_version_range   : "[${mc},)",
        // Floor at the compiled Core version — see the NeoForge build script for the reasoning.
        nerolandcore_version_range: "[${nerolandcoreVersion},2.0)",
        nerofactions_dep          : siblingOn.nerofactions ? tomlDep('nerofactions', rootProject.nerofactions_version, 'mandatory', 'false') : '',
        nerocolonies_dep          : siblingOn.nerocolonies ? tomlDep('nerocolonies', rootProject.nerocolonies_version, 'mandatory', 'false') : '',
        nerospace_dep             : siblingOn.nerospace ? tomlDep('nerospace', rootProject.nerospace_version, 'mandatory', 'false') : '',
        opac_dep                  : opacOn ? tomlDep('openpartiesandclaims', opacVersion.toString(), 'mandatory', 'false') : '',
    ]
    inputs.properties(props)
    expand(props)
    from "${branchDir}/src/main/templates"
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata

// Bundle the public wiki/*.md pages (plus a generated index.json) under assets/nerosecurity/wiki so the
// link module's wiki section can serve them (WIKI CONTRACT v1).
def generateWikiResources = tasks.register('generateWikiResources', Copy) {
    def wikiSrcDir = file("${rootProject.projectDir}/wiki")
    from(wikiSrcDir) {
        include '*.md'
        into 'assets/nerosecurity/wiki'
    }
    into layout.buildDirectory.dir('generated/sources/wiki')
    doLast {
        def outDir = layout.buildDirectory.dir('generated/sources/wiki/assets/nerosecurity/wiki').get().asFile
        outDir.mkdirs()
        def entries = []
        wikiSrcDir.listFiles()?.findAll { it.isFile() && it.name.endsWith('.md') }?.sort { it.name }?.each { f ->
            def slug = f.name.substring(0, f.name.length() - 3)
            def title = slug.replace('-', ' ')
            for (String line : f.readLines('UTF-8')) {
                def t = line.trim()
                if (t.startsWith('# ')) { title = t.substring(2).trim(); break }
                if (!t.isEmpty()) break
            }
            entries << [slug: slug, title: title]
        }
        def sb = new StringBuilder('{\n  "pages": [\n')
        entries.eachWithIndex { e, i ->
            sb.append('    {"slug": ').append(groovy.json.JsonOutput.toJson(e.slug))
              .append(', "title": ').append(groovy.json.JsonOutput.toJson(e.title)).append('}')
              .append(i < entries.size() - 1 ? ',' : '').append('\n')
        }
        sb.append('  ]\n}\n')
        new File(outDir, 'index.json').write(sb.toString(), 'UTF-8')
    }
}
sourceSets.main.resources.srcDir generateWikiResources

// Pre-create run directories so VS Code debug-terminal cwd exists before first launch.
def createForgeRunDirs = tasks.register('createForgeRunDirs') {
    description = 'Pre-create Forge run directories so the IDE debug-terminal cwd exists before first launch.'
    doLast {
        file('runs/client').mkdirs()
        file('runs/server').mkdirs()
    }
}
tasks.matching { it.name == 'configureLaunch' }.configureEach { dependsOn createForgeRunDirs }

// ecjCheck: run the Eclipse compiler over common + forge main sources, with the same prefs as VS Code.
configurations {
    ecj
}
dependencies {
    ecj 'org.eclipse.jdt:ecj:+'
}
tasks.register('ecjCheck', JavaExec) {
    group = 'verification'
    description = 'Run the Eclipse (IDE) analyzer over common + forge main sources and report its diagnostics.'
    notCompatibleWithConfigurationCache('assembles the analysis classpath at execution time')
    dependsOn tasks.named('compileJava')
    classpath = configurations.ecj
    mainClass = 'org.eclipse.jdt.internal.compiler.batch.Main'
    doFirst {
        def analysisCp = (sourceSets.main.compileClasspath.files + sourceSets.main.output.files)
                .findAll { it.exists() }
                .join(File.pathSeparator)
        // The source FILES, not the source dirs, so the `<x>_compat=false` excludes apply here exactly as in
        // compileJava. Passed through an @argfile (forward slashes) to keep the Windows command line short.
        def ecjSources = project.layout.buildDirectory.file('tmp/ecjCheck/sources.txt').get().asFile
        ecjSources.parentFile.mkdirs()
        ecjSources.text = sourceSets.main.java.files.collect { it.absolutePath.replace('\\', '/') }.join('\n') + '\n'
        def srcDirs = ['@' + ecjSources.absolutePath.replace('\\', '/')]
        args = [
                '--release', '25',
                '-proc:none',
                '-d', 'none',
                '-properties', rootProject.file('tools/ecj.prefs').absolutePath,
                // No '-warn:' override — tools/ecj.prefs is the single source of truth for severities.
                // A CLI -warn:+token forces a category ON regardless of the prefs `ignore`, so the
                // framework-interop nullness categories would re-appear. nullanalysis=enabled in the
                // prefs already turns annotation-based analysis on for the genuine categories.
                '-annotationpath', 'CLASSPATH',
                '-classpath', analysisCp,
        ] + srcDirs
    }
}
